# Запуск из корня репо (переменные берутся из корневого .env):
#   docker-compose --env-file .env -f infra/docker/docker-compose.yml up -d
name: estate-intelligence

services:
  postgres:
    # Postgres 16 + PostGIS; официальный postgis/postgis собран только под amd64
    image: imresamu/postgis:16-3.5-alpine
    container_name: estate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estate}
      POSTGRES_DB: ${POSTGRES_DB:-estate}
    ports:
      # 5433 на хосте: 5432 часто занят локальным Postgres (Homebrew)
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - estate_pgdata:/var/lib/postgresql/data
      - ../../services/collector/sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estate} -d ${POSTGRES_DB:-estate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: estate-clickhouse
    environment:
      # БД фиксирована: на неё ссылается sql/clickhouse/*.sql
      CLICKHOUSE_DB: estate
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-estate}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-estate}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - estate_chdata:/var/lib/clickhouse
      - ../../services/collector/sql/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: estate-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      # 9010 на хосте (9000 занят нативным протоколом ClickHouse)
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - estate_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: estate-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/${MINIO_DEFAULT_BUCKET:-mlflow}
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: estate-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
    entrypoint:
      - /bin/sh
      - -c
      - >
        pip install --no-cache-dir --upgrade "mlflow>=3.0.0" psycopg2-binary boto3 &&
        mlflow server
        --backend-store-uri postgresql://${POSTGRES_USER:-estate}:${POSTGRES_PASSWORD:-estate}@postgres:5432/mlflow
        --default-artifact-root s3://${MINIO_DEFAULT_BUCKET:-mlflow}/
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  estate_pgdata:
  estate_chdata:
  estate_miniodata:
