{{- define "estate-intelligence.prometheusConfig" -}}
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Каждая реплика inference скрейпится отдельно: через Service счётчики
  # прыгали бы между подами при HPA > 1.
  - job_name: "estate-inference"
    metrics_path: "/metrics"
    scrape_interval: 5s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [{{ .Release.Namespace | quote }}]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: inference
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8000"
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: estate-inference
      - target_label: env
        replacement: {{ .Values.global.environment | quote }}

  - job_name: "estate-clickhouse"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          service: "estate-clickhouse"
          env: {{ .Values.global.environment | quote }}

  - job_name: "prometheus"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
    {{- include "estate-intelligence.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    {{- include "estate-intelligence.prometheusConfig" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  labels:
    app: prometheus
    {{- include "estate-intelligence.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.persistence.size }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app: prometheus
    {{- include "estate-intelligence.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  labels:
    app: prometheus
    {{- include "estate-intelligence.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  labels:
    app: prometheus
    {{- include "estate-intelligence.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: prometheus-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
    {{- include "estate-intelligence.labels" . | nindent 4 }}
spec:
  replicas: 1
  # TSDB на RWO-диске держит lock: новый под не стартует, пока жив старый.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        checksum/config: {{ include "estate-intelligence.prometheusConfig" . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.monitoring.prometheus.image.repository }}:{{ .Values.monitoring.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.prometheus.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
    {{- include "estate-intelligence.labels" . | nindent 4 }}
spec:
  type: {{ .Values.monitoring.prometheus.service.type }}
  ports:
    - name: web
      port: {{ .Values.monitoring.prometheus.service.port }}
      targetPort: 9090
  selector:
    app: prometheus
