apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
    {{- include "estate-intelligence.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mlflow.replicaCount }}
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
          imagePullPolicy: {{ .Values.mlflow.image.pullPolicy }}
          command:
            - mlflow
            - server
            - --backend-store-uri
            - postgresql+psycopg2://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/mlflow
            - --default-artifact-root
            - s3://{{ .Values.minio.defaultBucket }}/
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --workers
            - "2"
            - --allowed-hosts
            - "*"
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.minio.rootUser | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.minio.rootPassword | quote }}
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: MLFLOW_S3_IGNORE_TLS
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app: mlflow
    {{- include "estate-intelligence.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  selector:
    app: mlflow
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-external
  labels:
    app: mlflow
    {{- include "estate-intelligence.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  ports:
    - name: http-external
      port: {{ .Values.mlflow.service.externalPort }}
      targetPort: 5000
  selector:
    app: mlflow
