# Глобальная конфигурация сбора метрик Prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Конфигурация таргетов сбора метрик
scrape_configs:
  # Метрики сервиса ML инференса FastAPI (CatBoost, RPS, Latency, Business Metrics)
  - job_name: "estate-inference"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["inference:8000"]
        labels:
          service: "estate-inference"
          env: "production"

  # Системные и асинхронные метрики ClickHouse OLAP-хранилища
  - job_name: "estate-clickhouse"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          service: "estate-clickhouse"
          env: "production"

  # Собственные метрики сервера Prometheus
  - job_name: "prometheus"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
